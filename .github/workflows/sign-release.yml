name: Sign & Release KA Play APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g., 4.10.136-PRE)'
        required: true
        type: string
      version_code:
        description: 'Version code (integer, e.g., 29876710)'
        required: true
        type: string
      source_repo:
        description: 'Source repository (owner/repo) to download from'
        required: false
        type: string
        default: ''
      source_tag:
        description: 'Source tag to download APK from'
        required: false
        type: string
        default: ''
      source_apk_name:
        description: 'Exact APK filename in source release (e.g. 4.10.140-PRE.apk). If empty, uses version_name.apk'
        required: false
        type: string
        default: ''
      is_stable:
        description: 'Mark as stable release'
        required: false
        type: boolean
        default: false
      notes:
        description: 'Release notes'
        required: false
        type: string
        default: 'Update via GitHub Actions'

env:
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  sign-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find apksigner tool
        id: apk_signer
        run: |
          echo "Searching for apksigner..."
          SDK_PATH=""
          
          # Check common GitHub runner Android SDK paths
          for p in "/usr/local/lib/android/sdk" "$ANDROID_SDK_ROOT" "$ANDROID_HOME"; do
            if [ -d "$p/build-tools" ]; then
              echo "Checking: $p"
              APK=$(find "$p/build-tools" -name "apksigner" -type f 2>/dev/null | sort -V | tail -1)
              if [ -n "$APK" ] && [ -x "$APK" ]; then
                SDK_PATH="$APK"
                echo "Found: $SDK_PATH"
                break
              fi
            fi
          done
          
          if [ -z "$SDK_PATH" ]; then
            echo "Installing Android build-tools via apt..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq android-sdk-build-tools > /dev/null 2>&1
            SDK_PATH="/usr/bin/apksigner"
            if [ ! -x "$SDK_PATH" ]; then
              echo "ERROR: Could not find or install apksigner"
              exit 1
            fi
          fi
          
          echo "Using: $SDK_PATH"
          echo "apksigner=$SDK_PATH" >> $GITHUB_OUTPUT

      - name: Create keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.keystore
          echo "Keystore ready: $(keytool -list -keystore keystore.keystore -storepass android 2>/dev/null | head -2)"

      - name: Download APK
        if: inputs.source_repo != '' && inputs.source_tag != ''
        run: |
          # Prefer explicit source_apk_name; fall back to version_name
          if [ -n "${{ inputs.source_apk_name }}" ]; then
            APK_NAME="${{ inputs.source_apk_name }}"
          else
            APK_NAME="${{ inputs.version_name }}.apk"
          fi
          echo "Downloading: $APK_NAME from tag ${{ inputs.source_tag }}"
          gh release download "${{ inputs.source_tag }}" \
            --repo "${{ inputs.source_repo }}" \
            --pattern "${APK_NAME}" \
            --output unsigned.apk --force --clobber || {
            echo "gh release download falhou, tentando curl direto..."
            curl -L --fail --silent --show-error -o unsigned.apk \
              "https://github.com/${{ inputs.source_repo }}/releases/download/${{ inputs.source_tag }}/${APK_NAME}"
          }
          echo "Downloaded:"
          du -h unsigned.apk
          file unsigned.apk

      - name: Use local APK
        if: inputs.source_repo == ''
        run: |
          if [ -f "unsigned.apk" ]; then
            echo "Using local unsigned.apk: $(du -h unsigned.apk)"
          else
            echo "ERROR: No APK found"
            exit 1
          fi

      - name: Sign APK
        run: |
          echo "=== Signing APK ==="
          echo "Certificate: CN=KA Play, OU=Mobile, O=Francisco Alro"
          echo "This ensures compatibility with existing installations."
          echo ""
          
          SIGNER="${{ steps.apk_signer.outputs.apksigner }}"
          echo "Using signer: $SIGNER"
          
          $SIGNER sign \
            --ks keystore.keystore \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out signed.apk \
            unsigned.apk
          
          echo ""
          echo "=== Signing complete ==="

      - name: Verify APK signature
        run: |
          SIGNER="${{ steps.apk_signer.outputs.apksigner }}"
          echo "=== APK Verification ==="
          $SIGNER verify -v --print-certs signed.apk 2>&1 | grep -E "Verified|Owner|SHA-256|CN=" || true
          
          echo ""
          echo "=== Certificate from JAR ==="
          keytool -printcert -jarfile signed.apk 2>/dev/null | grep -E "Owner|SHA256|Issuer" | head -4

      - name: Calculate SHA256
        id: sha256
        run: |
          SHA=$(sha256sum signed.apk | cut -d' ' -f1)
          echo "sha256=$SHA"
          echo "sha256=$SHA" >> $GITHUB_OUTPUT

      - name: Create update.json
        run: |
          RELEASE_TAG="v${{ inputs.version_name }}"
          REPO_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}"
          FILENAME="${{ inputs.version_name }}.apk"
          
          cat > update.json << EOF
          {
            "applicationId": "br.com.kaplay.app.prerelease",
            "versionName": "${{ inputs.version_name }}",
            "versionCode": ${{ inputs.version_code }},
            "sha256": "${{ steps.sha256.outputs.sha256 }}",
            "apkUrl": "${REPO_URL}/${FILENAME}"
          }
          EOF
          echo "update.json created:"
          cat update.json

      - name: Create update_stable.json
        if: inputs.is_stable
        run: |
          RELEASE_TAG="v${{ inputs.version_name }}"
          REPO_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}"
          FILENAME="${{ inputs.version_name }}.apk"
          
          cat > update_stable.json << EOF
          {
            "applicationId": "br.com.kaplay.app",
            "versionName": "${{ inputs.version_name }}",
            "versionCode": ${{ inputs.version_code }},
            "sha256": "${{ steps.sha256.outputs.sha256 }}",
            "apkUrl": "${REPO_URL}/${FILENAME}"
          }
          EOF
          echo "update_stable.json created"

      - name: Prepare APK filename
        run: |
          cp signed.apk "${{ inputs.version_name }}.apk"
          ls -lh "${{ inputs.version_name }}.apk"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}
          name: KA Play ${{ inputs.version_name }}
          body: |
            ${{ inputs.notes }}
            
            ## Version Info
            
            | Field | Value |
            |-------|-------|
            | Version Name | `${{ inputs.version_name }}` |
            | Version Code | `${{ inputs.version_code }}` |
            | SHA256 | `${{ steps.sha256.outputs.sha256 }}` |
            | Package | `br.com.kaplay.app.prerelease` |
            | Certificate | CN=KA Play, OU=Mobile, O=Francisco Alro |
            
            ---
            *Built with GitHub Actions - Same signature for seamless updates*
          files: |
            ${{ inputs.version_name }}.apk
            update.json
            update_stable.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Final Summary
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════"
          echo "              ✅ RELEASE COMPLETE"
          echo "═══════════════════════════════════════════════════════"
          echo ""
          echo "  Version:     ${{ inputs.version_name }}"
          echo "  Version Code: ${{ inputs.version_code }}"
          echo "  SHA256:      ${{ steps.sha256.outputs.sha256 }}"
          echo "  APK Size:    $(du -h "${{ inputs.version_name }}.apk" | cut -f1)"
          echo ""
          echo "  Release:"
          echo "  https://github.com/${{ github.repository }}/releases/tag/v${{ inputs.version_name }}"
          echo ""
          echo "═══════════════════════════════════════════════════════"
